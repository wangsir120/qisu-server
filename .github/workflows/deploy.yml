name: Test, Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean

env:
  DOTNET_VERSION: '8.0.x'
  SERVER_IP: 38.76.209.225
  SERVER_USER: root
  SERVER_PATH: /www/wwwroot/qisu-server

jobs:
  # ==================== Test Job ====================
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Debug --no-restore

    - name: Test
      run: dotnet test --configuration Debug --no-build --verbosity normal
      continue-on-error: true

    - name: Test Summary
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ==================== Build Job ====================
  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Publish
      run: dotnet publish -c Release -o publish --no-restore

    - name: Create deployment package
      run: |
        cd publish
        tar -czf ../deploy.tar.gz .
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: deploy-package
        path: deploy.tar.gz
        retention-days: 1

    - name: Build Summary
      run: |
        echo "## Build Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: Success" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration**: Release" >> $GITHUB_STEP_SUMMARY
        echo "- **Target Framework**: .NET 8.0" >> $GITHUB_STEP_SUMMARY

  # ==================== Deploy Job ====================
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: deploy-package

    - name: Prepare Server Directories
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.SERVER_IP }}
        username: ${{ env.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          echo "Creating directories..."
          mkdir -p ${{ env.SERVER_PATH }}
          mkdir -p ${{ env.SERVER_PATH }}/backup/$(date +%Y%m%d_%H%M%S)

    - name: Backup current deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.SERVER_IP }}
        username: ${{ env.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          if [ -f "${{ env.SERVER_PATH }}/qisu-server.dll" ]; then
            echo "Backing up current deployment..."
            BACKUP_DIR=$(ls -td ${{ env.SERVER_PATH }}/backup/*/ 2>/dev/null | head -1)
            if [ -n "$BACKUP_DIR" ]; then
              mv ${{ env.SERVER_PATH }}/*.dll $BACKUP_DIR 2>/dev/null || true
              mv ${{ env.SERVER_PATH }}/*.json $BACKUP_DIR 2>/dev/null || true
              mv ${{ env.SERVER_PATH }}/*.deps.json $BACKUP_DIR 2>/dev/null || true
              mv ${{ env.SERVER_PATH }}/*.runtimeconfig.json $BACKUP_DIR 2>/dev/null || true
              echo "Backup completed to $BACKUP_DIR"
            fi
          fi

    - name: Upload deployment package
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ env.SERVER_IP }}
        username: ${{ env.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "deploy.tar.gz"
        target: "/tmp"

    - name: Extract and deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.SERVER_IP }}
        username: ${{ env.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          echo "Extracting deployment package..."
          cd ${{ env.SERVER_PATH }}
          tar -xzf /tmp/deploy.tar.gz
          rm -f /tmp/deploy.tar.gz

          echo "Setting permissions..."
          find ${{ env.SERVER_PATH }} -type f -name "*.dll" -exec chmod 644 {} \;
          find ${{ env.SERVER_PATH }} -type f -name "*.json" -exec chmod 644 {} \;

    - name: Restart Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.SERVER_IP }}
        username: ${{ env.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          # 尝试使用宝塔面板的进程守护
          if [ -f "/www/server/panel/pyenv/bin/supervisorctl" ]; then
            echo "Restarting via Baota Supervisor..."
            /www/server/panel/pyenv/bin/supervisorctl restart qisu-server || true
            /www/server/panel/pyenv/bin/supervisorctl status qisu-server
          # 尝试使用系统 Supervisor
          elif command -v supervisorctl &> /dev/null; then
            echo "Restarting via Supervisor..."
            supervisorctl restart qisu-server || true
            supervisorctl status qisu-server
          # 尝试使用 systemctl
          elif command -v systemctl &> /dev/null; then
            echo "Restarting via systemctl..."
            systemctl restart qisu-server || true
            systemctl status qisu-server --no-pager
          else
            echo "No service manager found. Please restart manually."
          fi

    - name: Health Check
      run: |
        echo "Waiting for service to start..."
        sleep 10
        
        echo "Checking API health..."
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://qisu.sugu6.top/api/ || echo "000")
        
        if [ "$HTTP_CODE" -eq "200" ] || [ "$HTTP_CODE" -eq "401" ]; then
          echo "Health check passed (HTTP $HTTP_CODE)"
        else
          echo "Health check returned HTTP $HTTP_CODE"
          echo "Please verify manually: https://qisu.sugu6.top/api/"
        fi
      continue-on-error: true

    - name: Deployment Summary
      run: |
        echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **API URL** | https://qisu.sugu6.top/api |" >> $GITHUB_STEP_SUMMARY
        echo "| **Environment** | ${{ github.event.inputs.environment || 'production' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY